{% extends "base.html" %}
{% block title %}项目列表 - EasyDockCross{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>项目列表</h2>
  <a class="btn btn-primary" href="/projects/new">+ 新建项目</a>
</div>

<table class="table table-hover bg-white shadow-sm">
  <thead>
    <tr>
      <th>名称</th>
      <th>源码类型</th>
      <th>创建时间</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="project-list">
    <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
  </tbody>
</table>
{% endblock %}
{% block scripts %}
<script>
$(function(){
  loadProjects();
});

function loadProjects(){
  $.getJSON('/api/v1/projects', function(r){
    var rows = '';
    if(!r.items || r.items.length === 0){
      rows = '<tr><td colspan="4" class="text-center text-muted">暂无项目</td></tr>';
    } else {
      r.items.forEach(function(p){
        rows += '<tr>' +
          '<td>' + $('<div>').text(p.name).html() + '</td>' +
          '<td>' + p.source_type + '</td>' +
          '<td>' + (p.created_at ? p.created_at.replace('T',' ').substring(0,19) : '-') + '</td>' +
          '<td>' +
            '<a class="btn btn-sm btn-outline-primary" href="/projects/' + p.id + '">详情</a> ' +
            '<button class="btn btn-sm btn-success" onclick="triggerBuild(' + p.id + ')">构建</button> ' +
            '<button class="btn btn-sm btn-danger" onclick="deleteProject(' + p.id + ')">删除</button>' +
          '</td>' +
        '</tr>';
      });
    }
    $('#project-list').html(rows);
  });
}

function triggerBuild(id){
  if(!confirm('确定要立即构建该项目？')) return;
  $.post('/api/v1/projects/' + id + '/build', JSON.stringify({}), function(r){
    alert('构建已触发，构建组 ID: ' + r.id);
    window.location.href = '/builds/' + r.id;
  }, 'json').fail(function(xhr){
    alert('触发失败: ' + (xhr.responseJSON && xhr.responseJSON.error || '未知错误'));
  });
}

function deleteProject(id){
  if(!confirm('确定删除该项目？')) return;
  $.ajax({url:'/api/v1/projects/' + id, method:'DELETE', success:function(){
    loadProjects();
  }});
}
</script>
{% endblock %}
